<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Blesson Davis, Senior AI Engineer</title>
  <desc id="d">An agent at the centre of a small graph of tools: LLM, MCP, graph, map and eval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fe3e8"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .edge { stroke: #7c5cff; stroke-opacity: .35; stroke-width: 1.5; }
    .flow { stroke: #4fe3e8; stroke-width: 2; stroke-dasharray: 3 9; animation: flow 1.6s linear infinite; }
    .node { fill: #4fe3e8; }
    .dim  { fill: #7c5cff; fill-opacity: .6; }
    .lbl  { font: 500 13px ui-monospace, 'SFMono-Regular', Consolas, monospace; fill: #9aa4bf; }
    .pulse { fill: none; stroke: #7c5cff; stroke-width: 2; transform-origin: 900px 160px; animation: pulse 2.8s ease-out infinite; }
    .blink { animation: blink 3s ease-in-out infinite; }
    @keyframes flow  { to { stroke-dashoffset: -24; } }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="900" cy="160" r="190" fill="url(#glow)"/>

    <!-- outer edges -->
    <g class="edge">
      <line x1="780" y1="90"  x2="700" y2="56"/>
      <line x1="780" y1="90"  x2="712" y2="170"/>
      <line x1="1030" y1="80" x2="960" y2="34"/>
      <line x1="1030" y1="80" x2="1140" y2="96"/>
      <line x1="1100" y1="170" x2="1140" y2="96"/>
      <line x1="1100" y1="170" x2="1156" y2="252"/>
      <line x1="1020" y1="250" x2="1156" y2="252"/>
      <line x1="1020" y1="250" x2="880" y2="290"/>
      <line x1="800" y1="240" x2="880" y2="290"/>
      <line x1="800" y1="240" x2="712" y2="170"/>
      <line x1="780" y1="90"  x2="960" y2="34"/>
    </g>

    <!-- agent to tools, with data flowing -->
    <g class="edge">
      <line x1="900" y1="160" x2="780" y2="90"/>
      <line x1="900" y1="160" x2="1030" y2="80"/>
      <line x1="900" y1="160" x2="1100" y2="170"/>
      <line x1="900" y1="160" x2="1020" y2="250"/>
      <line x1="900" y1="160" x2="800" y2="240"/>
    </g>
    <g class="flow">
      <line x1="900" y1="160" x2="780" y2="90"/>
      <line x1="900" y1="160" x2="1030" y2="80"/>
      <line x1="900" y1="160" x2="1100" y2="170"/>
      <line x1="900" y1="160" x2="1020" y2="250"/>
      <line x1="900" y1="160" x2="800" y2="240"/>
    </g>

    <!-- small nodes -->
    <g class="dim">
      <circle cx="700" cy="56" r="4" class="blink"/>
      <circle cx="712" cy="170" r="4"/>
      <circle cx="960" cy="34" r="4"/>
      <circle cx="1140" cy="96" r="4" class="blink" style="animation-delay:1s"/>
      <circle cx="1156" cy="252" r="4"/>
      <circle cx="880" cy="290" r="4" class="blink" style="animation-delay:2s"/>
    </g>

    <!-- tools -->
    <g class="node">
      <circle cx="780" cy="90" r="7"/>
      <circle cx="1030" cy="80" r="7"/>
      <circle cx="1100" cy="170" r="7"/>
      <circle cx="1020" cy="250" r="7"/>
      <circle cx="800" cy="240" r="7"/>
    </g>
    <text class="lbl" x="752" y="74">LLM</text>
    <text class="lbl" x="1042" y="68">MCP</text>
    <text class="lbl" x="1114" y="175">graph</text>
    <text class="lbl" x="1034" y="274">map</text>
    <text class="lbl" x="756" y="264">eval</text>

    <!-- agent -->
    <circle class="pulse" cx="900" cy="160" r="15"/>
    <circle cx="900" cy="160" r="15" fill="#7c5cff"/>
    <circle cx="900" cy="160" r="6" fill="#ffffff"/>
    <text class="lbl" x="922" y="152" style="fill:#d6dcf0">agent</text>

    <!-- text -->
    <text x="64" y="146" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Blesson Davis</text>
    <text x="66" y="198" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="url(#accent)">Senior AI Engineer</text>
    <text x="66" y="238" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#9aa4bf">Agents · Knowledge graphs · Geospatial AI</text>
    <rect x="66" y="262" width="56" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
